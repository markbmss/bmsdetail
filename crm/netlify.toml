# BMS Detail CRM — separate Netlify site (crm.bmsdetail.com)
# Deploy this site with base directory set to "crm" in the Netlify dashboard.
# Fully independent from the main site and client-files-app deploys — this
# config only affects builds where base = "crm".
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
